version: 2
project_name: beam
builds:
  - id: beam
    main: ./cmd/beam
    binary: beam
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - id: platforms
    ids: [beam]
    name_template: "beam_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - integrations/skill/SKILL.md
checksum:
  name_template: SHA256SUMS
changelog:
  disable: true
release:
  disable: true
snapshot:
  version_template: "{{ .Env.BEAM_VERSION }}"
