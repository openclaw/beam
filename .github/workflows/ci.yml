name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - name: Exercise the installed CLI
        shell: bash
        run: |
          binary="$RUNNER_TEMP/beam"
          if [ "$RUNNER_OS" = Windows ]; then binary="$(cygpath -u "$RUNNER_TEMP")/beam.exe"; fi
          go build -o "$binary" ./cmd/beam
          "$binary" --version
          "$binary" inspect conformance/packet/example.beam.json
          "$binary" doctor --json
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: node schema/packet-generate.mjs --check
      - name: Compile the public validator with strict indexed access
        run: npm exec --yes --package=typescript@6.0.3 -- tsc --noEmit --strict --noUncheckedIndexedAccess --target ES2022 --module ESNext --lib ES2022,DOM schema/packet-v2.ts
      - run: node --test schema/packet-v2.test.mjs
